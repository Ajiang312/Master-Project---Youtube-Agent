<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - CreaTube</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #dc2626;
      --primary-hover: #b91c1c;
      --secondary-bg: #f0f0f0;
      --secondary-hover: #e0e0e0;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success-bg: #d1fae5;
      --success-text: #065f46;
      --success-border: #10b981;
      --error-bg: #fee2e2;
      --error-text: #991b1b;
      --error-border: #ef4444;
      --info-bg: #dbeafe;
      --info-text: #1e40af;
      --info-border: #3b82f6;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #ff4d4d 0%, #b30000 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 450px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    #auth-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input {
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
    }

    .btn-secondary {
      background: var(--secondary-bg);
      color: #333;
    }

    .btn-secondary:hover {
      background: var(--secondary-hover);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      background: var(--danger-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    #status {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      min-height: 20px;
    }

    .status-success {
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }

    .status-error {
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid var(--error-border);
    }

    .status-info {
      background: var(--info-bg);
      color: var(--info-text);
      border: 1px solid var(--info-border);
    }

    .user-info {
      background: #f9fafb;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
      border: 1px solid #e5e7eb;
    }

    .user-info h3 {
      color: #333;
      margin-bottom: 10px;
      font-size: 18px;
    }

    .user-info p {
      color: #666;
      font-size: 14px;
      margin: 5px 0;
      word-break: break-all;
    }

    .hidden {
      display: none;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    @media (max-width: 520px) {
      .container {
        padding: 24px;
      }

      .button-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Authentification</h1>
    <p class="subtitle">Connexion à votre espace CreaTube</p>

    <div id="auth-form">
      <input type="email" id="email" placeholder="Email" autocomplete="email">
      <input type="password" id="password" placeholder="Mot de passe" autocomplete="current-password">
      <input type="text" id="channel_id" placeholder="Channel ID YouTube (ex: UC1234567890)" required>
      
      <div class="button-group">
        <button class="btn-primary" onclick="handleSignUp()" id="signup-btn">S'inscrire</button>
        <button class="btn-secondary" onclick="handleLogin()" id="login-btn">Se connecter</button>
      </div>
    </div>

    <div id="status"></div>

    <div id="user-info" class="user-info hidden">
      <h3>✅ Connecté</h3>
      <p><strong>Email:</strong> <span id="user-email"></span></p>
      <p><strong>User ID:</strong> <span id="user-id"></span></p>
      <p><strong>Channel ID:</strong> <span id="channel-id"></span></p>
      <button class="btn-danger" onclick="handleLogout()" style="margin-top: 15px; width: 100%;">Se déconnecter</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const { createClient } = supabase;
    const sb = createClient(
      'https://rtztgwuqzaoytkyencei.supabase.co', 
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInR5cCI6IkpXVCJ9'
    );
  </script>

  <script>
    const sb2 = createClient(
      'https://rtztgwuqzaoytkyencei.supabase.co', 
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0enRnd3VxemFveXRreWVuY2VpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI3NzEwODQsImV4cCI6MjA3ODM0NzA4NH0.bwFTvxRYJGGJag4SI1TVk8i0bjb-xiA4rhcmM6SR3PY'
    );

    // Pour garder exactement ta variable "sb"
    const realSb = sb2;
    window.sb = realSb;

    // Vérifier l'état de connexion au chargement
    checkAuthState();

    // Écouter les changements d'état d'authentification
    sb.auth?.onAuthStateChange?.(() => {});
    realSb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
        loadUserData();
      } else if (event === 'SIGNED_OUT') {
        showAuthForm();
      }
    });

    function showStatus(message, type = 'info') {
      const statusEl = document.getElementById('status');
      statusEl.textContent = message;
      statusEl.className = `status-${type}`;
      statusEl.style.display = message ? 'block' : 'none';
    }

    function setLoading(isLoading) {
      const form = document.getElementById('auth-form');
      const signupBtn = document.getElementById('signup-btn');
      const loginBtn = document.getElementById('login-btn');
      
      if (isLoading) {
        form.classList.add('loading');
        signupBtn.disabled = true;
        loginBtn.disabled = true;
      } else {
        form.classList.remove('loading');
        signupBtn.disabled = false;
        loginBtn.disabled = false;
      }
    }

    async function checkAuthState() {
      const { data: { session } } = await realSb.auth.getSession();
      if (session) {
        loadUserData();
      } else {
        showAuthForm();
      }
    }

    function showAuthForm() {
      document.getElementById('auth-form').style.display = 'flex';
      document.getElementById('user-info').classList.add('hidden');
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      document.getElementById('channel_id').value = '';
      showStatus('', 'info');
    }

    async function loadUserData() {
      const { data: { user } } = await realSb.auth.getUser();
      
      if (!user) {
        showAuthForm();
        return;
      }

      // Masquer le formulaire d'auth
      document.getElementById('auth-form').style.display = 'none';
      document.getElementById('user-info').classList.remove('hidden');
      
      // Afficher les infos utilisateur
      document.getElementById('user-email').textContent = user.email;
      document.getElementById('user-id').textContent = user.id;

      // Récupérer la chaîne de l'utilisateur connecté
      const { data: channel, error: chError } = await realSb
        .from('channels')
        .select('*')
        .eq('user_id', user.id)
        .single();

      if (chError) {
        document.getElementById('channel-id').textContent = 'Aucune chaîne trouvée';
        showStatus('Erreur lors de la récupération de la chaîne: ' + chError.message, 'error');
      } else {
        document.getElementById('channel-id').textContent = channel.channel_id || 'Non défini';
        localStorage.setItem('selectedChannel', JSON.stringify(channel));
        showStatus('Bienvenue ! Channel ID : ' + (channel.channel_id || 'N/A'), 'success');

        // REDIRECTION VERS INDEX.HTML
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      }
    }

    // PARCOURS 1 : INSCRIPTION + LIAISON AUTOMATIQUE
    async function handleSignUp() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const channelId = document.getElementById('channel_id').value.trim();

      if (!email || !password || !channelId) {
        showStatus('Veuillez remplir l\'email, le mot de passe et le Channel ID', 'error');
        return;
      }

      setLoading(true);
      showStatus('Création du compte en cours...', 'info');

      try {
        // 1. Création de l'utilisateur dans auth.users
        const { data: authData, error: authError } = await realSb.auth.signUp({ 
          email, 
          password 
        });

        if (authError) {
          showStatus('Erreur Auth: ' + authError.message, 'error');
          setLoading(false);
          return;
        }

        if (!authData.user) {
          showStatus('Erreur: Utilisateur non créé', 'error');
          setLoading(false);
          return;
        }

        // 2. Création de la ligne dans la table channels liée à l'user_id
        const { error: dbError } = await realSb
          .from('channels')
          .insert([{ 
            user_id: authData.user.id, 
            channel_id: channelId,
            title: "Nouvelle chaîne de " + email 
          }]);

        if (dbError) {
          showStatus('Compte créé mais erreur DB: ' + dbError.message, 'error');
          setLoading(false);
          return;
        }

        showStatus('Compte créé avec succès ! Vérifiez votre email pour confirmer.', 'success');
        
        // Si l'email n'a pas besoin de confirmation, charger les données
        if (authData.session) {
          setTimeout(() => loadUserData(), 1000);
        } else {
          setLoading(false);
        }
      } catch (error) {
        showStatus('Erreur inattendue: ' + error.message, 'error');
        setLoading(false);
      }
    }

    // PARCOURS 2 : LOGIN + VÉRIFICATION DES PERMISSIONS
    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showStatus('Veuillez remplir l\'email et le mot de passe', 'error');
        return;
      }

      setLoading(true);
      showStatus('Connexion en cours...', 'info');

      try {
        const { data, error } = await realSb.auth.signInWithPassword({ email, password });

        if (error) {
          showStatus('Erreur de connexion: ' + error.message, 'error');
          setLoading(false);
          return;
        }

        if (data.session) {
          showStatus('Connexion réussie !', 'success');
          setTimeout(() => loadUserData(), 500);
        }
      } catch (error) {
        showStatus('Erreur inattendue: ' + error.message, 'error');
        setLoading(false);
      }
    }

    // Déconnexion
    async function handleLogout() {
      setLoading(true);
      const { error } = await realSb.auth.signOut();
      
      if (error) {
        showStatus('Erreur lors de la déconnexion: ' + error.message, 'error');
        setLoading(false);
      } else {
        localStorage.removeItem('selectedChannel');
        showStatus('Déconnexion réussie', 'info');
        setTimeout(() => {
          showAuthForm();
          setLoading(false);
        }, 500);
      }
    }
  </script>
</body>
</html>
