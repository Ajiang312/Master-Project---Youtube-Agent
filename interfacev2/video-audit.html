<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreaTube - Audit Vidéo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="video-audit.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-play-circle"></i>
            </div>
            <span class="logo-text">CreaTube</span>
        </div>

        <nav class="navigation">
            <p class="nav-label">Navigation</p>
            <ul class="nav-menu">
                <li class="nav-item" onclick="window.location.href='index.html'">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </li>
                <li class="nav-item" onclick="window.location.href='generation-ia.html'">
                    <i class="fas fa-magic"></i>
                    <span>Génération IA</span>
                </li>
                <li class="nav-item active" onclick="window.location.href='videos.html'">
                    <i class="fas fa-video"></i>
                    <span>Mes Vidéos</span>
                </li>
                <li class="nav-item" onclick="window.location.href='analytics.html'">
                    <i class="fas fa-chart-line"></i>
                    <span>Analytics</span>
                </li>
                <li class="nav-item" onclick="window.location.href='settings.html'">
                    <i class="fas fa-cog"></i>
                    <span>Paramètres</span>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- Main -->
    <main class="main-content">
        <header class="header">
            <button class="menu-toggle">
                <i class="fas fa-bars"></i>
            </button>
        </header>

        <div class="audit-container">
            <div class="audit-topbar">
                <div class="audit-nav-buttons">
                    <button class="btn-back" onclick="window.location.href='videos.html'">
                        <i class="fas fa-arrow-left"></i>
                        Retour aux vidéos
                    </button>

                    <button class="btn-secondary-audit" id="detailsButton">
                        <i class="fas fa-chart-bar"></i>
                        Voir la fiche détail
                    </button>
                </div>
            </div>

            <div id="auditContent">
                <div class="loading-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Chargement de l'audit vidéo...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
    <script src="video-audit.js"></script>
</body>
</html>
