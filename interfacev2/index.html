<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreaTube - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-play-circle"></i>
            </div>
            <span class="logo-text">CreaTube</span>
        </div>
        
        <nav class="navigation">
            <p class="nav-label">Navigation</p>
            <ul class="nav-menu">
                <li class="nav-item active" onclick="window.location.href='index.html'">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </li>
                <li class="nav-item" onclick="window.location.href='generation-ia.html'">
                    <i class="fas fa-magic"></i>
                    <span>Génération IA</span>
                </li>
                <li class="nav-item" onclick="window.location.href='videos.html'">
                    <i class="fas fa-video"></i>
                    <span>Mes Vidéos</span>
                </li>
                <li class="nav-item" onclick="window.location.href='analytics.html'">
                    <i class="fas fa-chart-line"></i>
                    <span>Analytics</span>
                </li>
                <li class="nav-item" onclick="window.location.href='settings.html'">
                    <i class="fas fa-cog"></i>
                    <span>Paramètres</span>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="header">
            <button class="menu-toggle">
                <i class="fas fa-bars"></i>
            </button>
        </header>

        <!-- Dashboard Content -->
        <div class="dashboard">
            <div class="dashboard-header">
                <h1>Tableau de bord</h1>
                <p class="subtitle">Gérez votre contenu YouTube avec l'IA</p>
            </div>

            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-label">Abonnés</span>
                        <i class="fas fa-users stat-icon"></i>
                    </div>
                    <div class="stat-value">...</div>
                    <div class="stat-change positive"></div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-label">Nombre de vidéos</span>
                        <i class="fas fa-video stat-icon"></i>
                    </div>
                    <div class="stat-value">...</div>
                    <div class="stat-change positive"></div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-label">Vues totales</span>
                        <i class="fas fa-eye stat-icon"></i>
                    </div>
                    <div class="stat-value">...</div>
                    <div class="stat-change positive"></div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-label">Total likes</span>
                        <i class="fas fa-thumbs-up stat-icon"></i>
                    </div>
                    <div class="stat-value">...</div>
                    <div class="stat-change positive"></div>
                </div>
            </div>

            <!-- Content Grid -->
            <div class="content-grid">
                <!-- AI Assistant -->
                <div class="content-box assistant-box">
                    <div class="box-header">
                        <i class="fas fa-robot"></i>
                        <h2>ChatBot</h2>
                    </div>
                    
                    <!-- Zone de messages - VIDE au départ -->
                    <div class="assistant-message" id="chat-messages">
                        <!-- Les messages seront ajoutés dynamiquement ici -->
                    </div>
                    
                    <div class="assistant-input">
                        <input type="text" placeholder="Posez votre question...">
                        <button class="btn-send">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>

                <!-- Content Suggestions -->
                <div class="content-box suggestions-box">
                    <div class="box-header">
                        <i class="fas fa-lightbulb"></i>
                        <h2>Vidéos Récentes</h2>
                    </div>
                    
                    <div class="loading-suggestions">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Chargement des vidéos...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Importer Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Scripts personnalisés -->
    <script src="theme.js"></script>
    <script src="supabase-config.js"></script>
    <script src="dashboard.js"></script>
    <script src="script.js"></script>
</body>
</html>
